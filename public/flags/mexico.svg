<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Verde -->
  <rect width="300" height="600" fill="#006847"/>
  <!-- Blanco -->
  <rect x="300" width="300" height="600" fill="#FFFFFF"/>
  <!-- Rojo -->
  <rect x="600" width="300" height="600" fill="#CE1126"/>
  <!-- Escudo simplificado: águila central -->
  <g transform="translate(450,300)">
    <!-- Cuerpo del águila -->
    <ellipse cx="0" cy="-8" rx="22" ry="26" fill="#5C4033"/>
    <!-- Cabeza -->
    <circle cx="0" cy="-30" r="12" fill="#5C4033"/>
    <!-- Pico -->
    <polygon points="8,-28 18,-24 6,-22" fill="#FFC400"/>
    <!-- Ojo -->
    <circle cx="-4" cy="-31" r="3" fill="#FFC400"/>
    <!-- Alas -->
    <ellipse cx="-28" cy="-10" rx="16" ry="8" fill="#5C4033" transform="rotate(-20,-28,-10)"/>
    <ellipse cx="28" cy="-10" rx="16" ry="8" fill="#5C4033" transform="rotate(20,28,-10)"/>
    <!-- Patas / nopal -->
    <rect x="-4" y="16" width="8" height="14" fill="#5C4033"/>
    <!-- Nopal (tuna) -->
    <ellipse cx="0" cy="36" rx="18" ry="12" fill="#006847"/>
    <ellipse cx="-14" cy="28" rx="10" ry="7" fill="#006847"/>
    <ellipse cx="14" cy="28" rx="10" ry="7" fill="#006847"/>
    <!-- Serpiente -->
    <path d="M8,-20 Q30,0 20,20" stroke="#5C4033" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
