<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2">
  <!-- Nicaragua flag: Blue, White, Blue stripes -->
  <rect width="3" height="2" fill="#0057B8"/>
  <rect y="0.667" width="3" height="0.667" fill="#FFFFFF"/>
  <!-- Coat of arms (simplified triangle/rainbow) centered in white stripe -->
  <g transform="translate(1.5, 1) scale(0.18)">
    <!-- Triangle -->
    <polygon points="0,-2.2 2.2,1.8 -2.2,1.8" fill="#4CAF50" stroke="#2E7D32" stroke-width="0.2"/>
    <!-- Rainbow arcs -->
    <path d="M -1.2 1.2 Q 0 -0.8 1.2 1.2" stroke="#FF5722" fill="none" stroke-width="0.35"/>
    <path d="M -0.9 1.2 Q 0 -0.4 0.9 1.2" stroke="#FF9800" fill="none" stroke-width="0.3"/>
    <path d="M -0.6 1.2 Q 0 0 0.6 1.2" stroke="#FFEB3B" fill="none" stroke-width="0.25"/>
    <path d="M -0.3 1.2 Q 0 0.3 0.3 1.2" stroke="#4CAF50" fill="none" stroke-width="0.2"/>
    <path d="M -0.1 1.2 Q 0 0.6 0.1 1.2" stroke="#2196F3" fill="none" stroke-width="0.18"/>
    <!-- Volcano (simplified) -->
    <polygon points="0,0.8 0.5,1.6 -0.5,1.6" fill="#795548"/>
    <!-- Sun/light rays (simplified) -->
    <circle cx="0" cy="-0.8" r="0.28" fill="#FFEB3B"/>
    <!-- Water line -->
    <path d="M -1.1 1.6 Q -0.55 1.4 0 1.6 Q 0.55 1.8 1.1 1.6" fill="#2196F3" stroke="none"/>
  </g>
</svg>
