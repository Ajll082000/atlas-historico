<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Rojo superior -->
  <rect width="900" height="150" fill="#c60b1e"/>
  <!-- Amarillo central -->
  <rect y="150" width="900" height="300" fill="#ffc400"/>
  <!-- Rojo inferior -->
  <rect y="450" width="900" height="150" fill="#c60b1e"/>
  <!-- Escudo simplificado -->
  <g transform="translate(310,220)">
    <!-- Forma del escudo -->
    <path d="M0,0 h80 v100 q0,30 -40,50 q-40,-20 -40,-50 Z" fill="#c60b1e" stroke="#8B0000" stroke-width="2"/>
    <!-- División central -->
    <line x1="40" y1="0" x2="40" y2="150" stroke="#8B0000" stroke-width="2"/>
    <!-- Cuartel izquierdo: castillo -->
    <rect x="10" y="20" width="20" height="25" fill="#8B0000"/>
    <rect x="7" y="15" width="5" height="10" fill="#8B0000"/>
    <rect x="15" y="15" width="5" height="10" fill="#8B0000"/>
    <rect x="23" y="15" width="5" height="10" fill="#8B0000"/>
    <!-- Cuartel derecho: león -->
    <text x="50" y="55" font-size="28" fill="#8B0000" text-anchor="middle">♞</text>
    <!-- Corona -->
    <path d="M20,0 h40 l-5,-12 l-15,8 l-15,-8 Z" fill="#ffc400" stroke="#c8960c" stroke-width="1"/>
  </g>
</svg>
